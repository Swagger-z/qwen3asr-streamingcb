[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-asr-contextual-biasing"
version = "0.1.0"
description = "Stateful cross-chunk contextual biasing for Qwen3-ASR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
config = ["PyYAML>=6,<7"]
probe = ["torch>=2.6", "pypinyin>=0.53", "cmudict>=1.1"]
qwen = [
  "qwen-asr==0.0.6",
  "transformers==4.57.6",
  "vllm==0.14.0",
]

[project.scripts]
qwen-contextual-decode = "scripts.decode_streaming_contextual:main"
qwen-contextual-eval = "scripts.eval_contextual:main"
qwen-contextual-train-probe = "scripts.train_phoneme_probe:main"
train_glclap_retriever = "scripts.train_glclap_retriever:main"
build_glclap_catalogs = "scripts.build_glclap_catalogs:main"
build_glclap_index = "scripts.build_glclap_index:main"
decode_streaming_retrieval = "scripts.decode_streaming_retrieval:main"
eval_hotword_retrieval = "scripts.eval_hotword_retrieval:main"

[tool.setuptools.packages.find]
include = ["asr*", "scripts*"]
